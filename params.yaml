vectorstore: 
  embedding_model: BAAI/bge-small-en-v1.5
  collection_name: insurance_policy_chunks
  vector_db_path: data/vectorstore
  chunks_file: data/processed/chunks.json

retrieval:
  dense_top_k: 10
  final_top_k: 4
  reranker_model: "rerank-v3.5"
  guardrail_minimum_score: 0.40

evaluation:
  model: "gpt-4.1-mini"
  threshold: 0.7

generation:
  model: "gpt-4.1-mini"
  temperature: 0
  prompt_name: "insurance-rag-system-prompt"
  prompt_label: "staging"
  input_cost_per_1m: 2.50
  output_cost_per_1m: 10.00

deepeval:
  max_concurrent: 5
  throttle_value: 2
  run_async: true

dataset:
  path: "data/evaluation/golden_dataset.json"
  safety_golden_path: "data/evaluation/safety_golden_dataset.json"