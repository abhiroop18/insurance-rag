name: Insurance RAG CI

on:
  push:
    paths:
      - "params.yaml"

  workflow_dispatch:

jobs:
  rag-evaluation:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Check Langfuse configuration
        run: |
          if [[ "$LANGFUSE_HOST" =~ ^https?:// ]]; then
            echo "LANGFUSE_HOST format looks correct"
          else
            echo "LANGFUSE_HOST is missing http:// or https://"
            exit 1
          fi

      - name: Build document chunks
        run: |
          uv run python -m insurance_rag.ingestion.load_documents

      - name: Build Qdrant vectorstore
        run: |
          uv run python -m insurance_rag.ingestion.build_vectorstore

      - name: Run experiment
        run: |
          uv run python -m insurance_rag.execute_experiment_pipeline

      - name: Run regression test
        run: |
          uv run python -m insurance_rag.tests.regression_test

      - name: Run promotion test
        run: |
          uv run python -m insurance_rag.tests.promotion_test